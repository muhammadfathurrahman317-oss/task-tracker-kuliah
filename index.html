<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker Kuliah</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <span class="icon">📋</span>
      <h1>Task Tracker Kuliah</h1>
    </div>

    <form id="task-form">
      <div class="form-row">
        <input type="text" id="task-title" placeholder="Judul tugas (min. 3 karakter)">
      </div>
      <div class="form-row flex-row">
        <select id="task-course">
          <option value="Pemrograman Web">Pemrograman Web</option>
          <option value="Basis Data">Basis Data</option>
          <option value="Algoritma & Struktur Data">Algoritma & Struktur Data</option>
          <option value="Jaringan Komputer">Jaringan Komputer</option>
        </select>
        <input type="date" id="task-deadline">
        <button type="submit" id="btn-submit">Tambah</button>
      </div>
      <div id="error-message" class="error-msg"></div>
    </form>

    <div class="filter-bar">
      <div class="filter-buttons">
        <button type="button" class="filter-btn on" data-filter="semua">Semua</button>
        <button type="button" class="filter-btn" data-filter="aktif">Aktif</button>
        <button type="button" class="filter-btn" data-filter="selesai">Selesai</button>
      </div>
      <span id="task-counter" class="counter">0 tugas aktif</span>
    </div>

    <ul id="task-list"></ul>
    <div id="empty-state" class="empty-state">Belum ada tugas.</div>
  </div>
</body>
</html>
